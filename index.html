<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Süzülen Sincap</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="layout">
      <h1>Süzülen Sincap</h1>
      <p class="description">Flappy Bird tarzı oyunda sincabı ağaçların arasından süzdür!</p>
      <canvas id="game" width="420" height="640" aria-label="Süzülen sincap oyunu"></canvas>
      <div class="controls">
        <button id="startButton">Başlat / Tekrar Oyna</button>
        <p><strong>Kontrol:</strong> Boşluk, tıklama veya dokunma ile yüksel.</p>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
